    <script>
      // Single Page App redirect: route /animehub/categories -> /animehub/#/categories
      (function() {
        var path = window.location.pathname;
        var base = '/animehub/';
        if (path.startsWith(base) && path.length > base.length) {
          var sub = path.slice(base.length);
          if (!sub.startsWith('#') && !sub.includes('.')) {
            window.location.replace(base + '#/' + sub + window.location.search);
          }
        }
      })();
    </script>
